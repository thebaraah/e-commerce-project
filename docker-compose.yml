version: '3.9' 
 
services: 
 postgres: 
   image: postgres:15 
   container_name: dbt_postgres 
   restart: always 
   environment: 
     POSTGRES_USER: baraah 
     POSTGRES_PASSWORD: password@123
     POSTGRES_DB: e_comm
   ports: 
     - "5433:5432" 
   volumes: 
     - postgres_data:/var/lib/postgresql/data 
   networks: 
     - dbt_network 
 
 dbt: 
   build: . 
   container_name: dbt_core 
   volumes: 
     - ./dbt_project:/usr/app 
     - ./dbt_project/.dbt:/root/.dbt
   depends_on: 
     - postgres 
   networks: 
     - dbt_network 

 data_generator:
    build: .
    container_name: ecommerce_data_generator
    working_dir: /usr/app
    entrypoint: ["python"]
    command: ["data-source/generate_sales.py"]
    volumes:
      - .:/usr/app
 
volumes: 
 postgres_data: 
 
networks: 
 dbt_network: 
   driver: bridge 